<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c5f2d">
    <title>Biology Study Guide - 生物学习笔记</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Mobile Menu Toggle (outside sidebar) -->
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>

        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📚 Biology Notes</h2>
            </div>
            <ul class="nav-links" id="navLinks">
                <!-- Navigation will be populated dynamically -->
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <h1>Biology Study Guide</h1>
                <p class="subtitle">生物学习笔记整理</p>
            </header>

            <div id="content">
                <!-- Content will be loaded dynamically -->
                <section class="welcome">
                    <h2>Welcome to Your Biology Study Guide</h2>
                    <p>This study guide organizes your biology notes by topic for easy review.</p>
                    <p>Select a topic from the sidebar to begin studying.</p>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
